<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salimos · Agenda cultural de Berisso</title>

    {# htmx se carga por CDN: permite navegar (links, botones) sin recargar. #}
    <script src="https://unpkg.com/htmx.org"></script>

    <style>
        :root {
            --fondo: #faf7f2;
            --superficie: #ffffff;
            --texto: #1f2937;
            --texto-suave: #6b7280;
            --primario: #b45309;      /* ámbar/naranja típico de cartel cultural */
            --primario-oscuro: #92400e;
            --borde: #e7e0d5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Encabezado sencillo del sitio público */
        header {
            background: var(--superficie);
            border-bottom: 1px solid var(--borde);
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .marca { font-size: 1.6rem; font-weight: 700; color: var(--primario); text-decoration: none; }
        header .eslogan { color: var(--texto-suave); font-size: 0.95rem; }

        /* El contenido principal: acá htmx inyecta los parciales */
        main {
            flex: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            width: 100%;
        }

        h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
        .subtitulo { color: var(--texto-suave); margin-bottom: 1.75rem; font-style: italic; }

        /* Grilla de tarjetas de eventos */
        .grilla {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .tarjeta {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .tarjeta img { width: 100%; height: 180px; object-fit: cover; display: block; background: #eee; }
        .tarjeta .cuerpo { padding: 1rem; display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }

        .categoria {
            align-self: flex-start;
            background: #fef3c7;
            color: var(--primario-oscuro);
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.15rem 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .tarjeta h2 { font-size: 1.05rem; line-height: 1.3; }
        .tarjeta .fecha { color: var(--primario-oscuro); font-weight: 600; font-size: 0.9rem; }
        .tarjeta .lugar, .tarjeta .precio { color: var(--texto-suave); font-size: 0.85rem; }

        /* Botón "ver más" que navega con htmx sin recargar */
        .ver-mas {
            margin-top: auto;
            align-self: flex-start;
            background: none;
            border: 1px solid var(--primario);
            color: var(--primario-oscuro);
            border-radius: 8px;
            padding: 0.45rem 0.9rem;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .ver-mas:hover { background: var(--primario); color: #fff; }

        /* Detalle de un evento */
        .detalle { background: var(--superficie); border: 1px solid var(--borde); border-radius: 14px; overflow: hidden; }
        .detalle img { width: 100%; max-height: 340px; object-fit: cover; display: block; background: #eee; }
        .detalle .cuerpo { padding: 1.75rem; }
        .detalle h1 { margin-bottom: 0.75rem; }
        .detalle .fila { margin-bottom: 0.5rem; }
        .detalle .etiqueta { color: var(--texto-suave); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .detalle .valor { font-size: 1.05rem; }
        .detalle .descripcion { margin-top: 1rem; line-height: 1.55; }
        .detalle a.fuente { display: inline-block; margin-top: 1.25rem; color: var(--primario-oscuro); }

        /* Botón volver */
        button.volver {
            background: none; border: none; color: var(--primario-oscuro);
            font-size: 0.95rem; cursor: pointer; margin-bottom: 1rem;
            text-decoration: underline;
        }

        footer {
            border-top: 1px solid var(--borde);
            text-align: center;
            padding: 1.2rem;
            color: var(--texto-suave);
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <header>
        <a class="marca" href="/" hx-get="/eventos" hx-target="#contenido" hx-push-url="true">Salimos</a>
        <span class="eslogan">Agenda cultural de Berisso</span>
    </header>

    {# Al entrar, la grilla de eventos se carga sola. #}
    <main id="contenido" hx-get="/eventos" hx-trigger="load">
    </main>

    <footer>Salimos · eventos culturales de Berisso</footer>
</body>
</html>
